<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RxJS Bindings</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color-scheme: light dark;
      }
      body {
        max-width: 42rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-block: 1rem;
        flex-wrap: wrap;
      }
      input, button {
        font: inherit;
        padding: 0.5rem 0.75rem;
      }
      .is-zero {
        opacity: 0.6;
      }
      .invalid {
        outline: 2px solid currentColor;
      }
      .control-state {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.35rem 1rem;
      }
      code {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>

    <label class="row">
      <span>Name</span>
      <input id="nameInput" autocomplete="off" />
    </label>

    <p>Hello <strong id="name"></strong></p>
    <p>Counter: <strong id="count"></strong></p>

    <div class="row">
      <button id="decrement" type="button">−</button>
      <button id="increment" type="button">+</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <hr />

    <section aria-labelledby="formControlTitle">
      <h2 id="formControlTitle">RxJS Form Control</h2>

      <label class="row">
        <span>Email</span>
        <input id="emailInput" type="email" autocomplete="off" />
      </label>

      <div class="row">
        <button id="emailSetExample" type="button">Set example value</button>
        <button id="emailReset" type="button">Reset control</button>
      </div>

      <dl class="control-state">
        <dt>value</dt>
        <dd><code id="emailValue"></code></dd>
        <dt>valid</dt>
        <dd><code id="emailValid"></code></dd>
        <dt>dirty</dt>
        <dd><code id="emailDirty"></code></dd>
        <dt>touched</dt>
        <dd><code id="emailTouched"></code></dd>
        <dt>errors</dt>
        <dd><code id="emailErrors"></code></dd>
      </dl>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
